# ─────────────────────────────────────────────
# SHIBI • HYPRLOCK
# Minimal / Glass / Cinematic
# ─────────────────────────────────────────────

general {
    hide_cursor = true
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
}

# ─────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────

background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 8

    brightness = 0.55
    contrast = 0.90
    vibrancy = 0.15
    vibrancy_darkness = 0.2

    noise = 0.02
}

# ─────────────────────────────────────────────
# CLOCK
# ─────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%H:%M')"

    color = rgba(255,255,255,0.96)

    font_size = 92
    font_family = DejaVu Sans

    position = 0, 110

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0,0,0,0.45)
}

# ─────────────────────────────────────────────
# DATE
# ─────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:60000] echo "$(date '+%A, %d %B')"

    color = rgba(255,255,255,0.70)

    font_size = 19
    font_family = DejaVu Sans

    position = 0, 5

    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# USER
# ─────────────────────────────────────────────

label {
    monitor =

    text = <b>$USER</b>

    color = rgba(255,255,255,0.90)

    font_size = 17
    font_family = DejaVu Sans

    position = 0, -120

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0,0,0,0.35)
}

# ─────────────────────────────────────────────
# PASSWORD FIELD
# ─────────────────────────────────────────────

input-field {
    monitor =

    size = 360, 64

    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(255,255,255,0.30) rgba(255,255,255,0.08) 45deg

    inner_color = rgba(20,20,25,0.48)

    font_color = rgba(255,255,255,0.95)

    font_family = DejaVu Sans

    fade_on_empty = false

    placeholder_text = <i>Password</i>

    rounding = 18

    check_color = rgba(100,220,180,0.9) rgba(80,170,255,0.9) 45deg

    fail_color = rgba(255,90,90,0.95) rgba(255,150,80,0.95) 45deg

    position = 0, -205

    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0,0,0,0.40)
}

# ─────────────────────────────────────────────
# LOCK MESSAGE
# ─────────────────────────────────────────────

label {
    monitor =

    text = <i>Press Enter to unlock</i>

    color = rgba(255,255,255,0.42)

    font_size = 13
    font_family = DejaVu Sans

    position = 0, -285

    halign = center
    valign = center
}
